# dbt Documentation Version Tracker - Configuration
# --------------------------------------------------

# Path to the dbt project to track documentation for
dbt_project_path: "./case_study"

# Where to store documentation snapshots
snapshot_dir: "./snapshots"

# Where to store the cumulative changelog
changelog_dir: "./changelogs"

# Glob patterns for finding schema YAML files (relative to dbt_project_path)
schema_patterns:
  - "**/*.yml"

# Directories to skip when scanning
exclude_dirs:
  - "dbt_packages"
  - "target"
  - "logs"

# Glob patterns for finding doc block .md files (relative to dbt_project_path)
doc_block_patterns:
  - "**/*.md"

# Confluence settings (used only when not in --dry-run mode)
confluence:
  base_url: "https://your-domain.atlassian.net/wiki"
  space_key: "DATA"
  parent_page_id: "123456789"
  # Auth via environment variables: CONFLUENCE_EMAIL, CONFLUENCE_API_TOKEN
