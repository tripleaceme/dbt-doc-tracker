version: 2

models:
  - name: doc_current_state
    description: >
      Shows the current documentation state derived from the doc_changelog table.
      Useful for auditing documentation coverage across your dbt project.
      Only includes entities that are currently documented (excludes removed entries).
    columns:
      - name: entity_type
        description: "The dbt resource type: 'model', 'source', or 'seed'"
      - name: entity_name
        description: "Name of the entity (e.g., 'fct_daily_sales' or 'hoodie_sales.orders')"
      - name: field_name
        description: "Column name, or '__description__' for entity-level documentation"
      - name: description
        description: "The current documentation text"
      - name: captured_at
        description: "Timestamp when the latest change was recorded"
      - name: invocation_id
        description: "dbt invocation ID that recorded the latest change"
