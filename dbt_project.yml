name: 'dbt_doc_tracker'
version: '1.0.0'
config-version: 2

require-dbt-version: [">=1.6.0", "<2.0.0"]

macro-paths: ["macros"]
model-paths: ["models"]

vars:
  # Override these in your dbt_project.yml to store doc snapshots
  # in a custom database/schema. Defaults to target.database / target.schema.
  dbt_doc_tracker_database: null
  dbt_doc_tracker_schema: null

models:
  dbt_doc_tracker:
    +materialized: view
