name: dbt Documentation Tracker

on:
  push:
    branches: [main]
    paths:
      - 'models/**/*.yml'
      - 'models/**/*.md'
      - 'data/schema/**/*.yml'

jobs:
  track-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dbt project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout doc tracker
        uses: actions/checkout@v4
        with:
          repository: your-org/dbt-doc-tracker
          path: doc-tracker

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r doc-tracker/requirements.txt

      - name: Restore previous snapshots
        uses: actions/cache@v4
        with:
          path: doc-tracker/snapshots
          key: doc-snapshots-${{ github.ref_name }}
          restore-keys: doc-snapshots-

      - name: Run documentation tracker
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: |
          cd doc-tracker
          python run.py --config config.yml

      - name: Save snapshot cache
        uses: actions/cache/save@v4
        with:
          path: doc-tracker/snapshots
          key: doc-snapshots-${{ github.ref_name }}-${{ github.sha }}
